user nginx;
worker_processes 1;
pid /var/run/nginx.pid;

# Nginx error messages may contain the original request line including tokens.
# Use metadata-only access logs below and application logs for diagnostics.
error_log /dev/null;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Do not log $request, $request_uri, $args, cookies, headers or request bodies.
    log_format metadata '$time_iso8601 peer=$remote_addr method=$request_method '
                        'path=$uri status=$status bytes=$body_bytes_sent '
                        'duration=$request_time';
    access_log /dev/stdout metadata;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Keep $remote_addr as the actual Cloudflare socket peer for allow/deny.
    # Cloudflare overwrites CF-Connecting-IP. Local operator requests fall back
    # to their socket peer. Never trust or append an inbound X-Forwarded-For.
    map $http_cf_connecting_ip $forwarded_client_ip {
        default $http_cf_connecting_ip;
        '' $remote_addr;
    }

    ssl_certificate /etc/nginx/tls/origin.pem;
    ssl_certificate_key /etc/nginx/tls/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Cloudflare's hostname-scoped Origin Rule also sends HTTP requests to
    # this TLS port. Handle Nginx's plain-HTTP-on-TLS status before rewrite
    # or access phases, including when the default virtual server is selected.
    # The target authority is fixed; never reflect Host or forwarded headers.
    error_page 497 =308 https://xianyu.sulian.org$request_uri;

    server {
        listen 8443 ssl default_server;
        server_name _;
        return 444;
    }

    server {
        listen 8443 ssl;
        server_name xianyu.sulian.org;

        # Generated at deployment time from Cloudflare's official IPv4/IPv6
        # lists. Missing file intentionally prevents this proxy from starting.
        include /etc/nginx/cloudflare-allowlist.conf;
        allow 127.0.0.1;
        allow ::1;
        allow 172.30.47.1;
        deny all;

        client_max_body_size 16m;
        client_body_timeout 30s;
        keepalive_timeout 65s;
        send_timeout 300s;

        proxy_http_version 1.1;
        proxy_set_header Host xianyu.sulian.org;
        proxy_set_header X-Forwarded-Host xianyu.sulian.org;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Real-IP $forwarded_client_ip;
        proxy_set_header X-Forwarded-For $forwarded_client_ip;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_hide_header Server;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;

        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;

        location = / {
            # Let the backend emit its relative 308 after Nginx access checks.
            # A local `return` would bypass the allow/deny access phase.
            proxy_pass http://app:8096/xianyu-saas;
        }

        location = /xianyu-saas {
            proxy_pass http://app:8096;
        }

        # FastAPI serves both the static page and public API prefix itself.
        # Do not expose the bare /api/ or /internal/ routes through this proxy.
        location ^~ /xianyu-saas/ {
            proxy_pass http://app:8096;
        }

        location / {
            deny all;
        }
    }
}
