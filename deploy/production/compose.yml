name: xianyu-saas

services:
  app:
    image: ${XIANYU_IMAGE:?Set XIANYU_IMAGE in config/image.env}
    container_name: xianyu-saas-app
    restart: unless-stopped
    env_file:
      - ../config/production.env
    environment:
      SAAS_ENV: production
      SAAS_TESTING: "0"
      SAAS_DB: /data/saas.db
      SAAS_TENANTS_DIR: /data/tenants
      SAAS_BOT_ROOT: /app/worker
      SAAS_APP_CODE_DIR: /data/app-code
      SAAS_PUBLIC_ORIGIN: https://xianyu.sulian.org
      SAAS_COOKIE_SECURE: "1"
      SAAS_TRUSTED_HOSTS: xianyu.sulian.org,127.0.0.1:8096,localhost:8096
      # Preserve the socket peer for the application's own trusted-proxy checks.
      SAAS_TRUSTED_PROXY_IPS: 172.30.47.3
      SAAS_LAUNCH_API_ARGS: >-
        --no-proxy-headers --no-access-log
        --limit-concurrency 100 --backlog 128
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      - ../data:/data
    mem_limit: 768m
    cpus: "1.0"
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      production:
        ipv4_address: 172.30.47.2

  nginx:
    image: ${NGINX_IMAGE:-nginx:stable-alpine}
    container_name: xianyu-saas-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      # IPv4 only: avoid IPv6 docker-proxy collapsing peers to the gateway IP.
      - "0.0.0.0:8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./cloudflare-allowlist.conf:/etc/nginx/cloudflare-allowlist.conf:ro
      - ../config/tls:/etc/nginx/tls:ro
    mem_limit: 96m
    cpus: "0.25"
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      production:
        ipv4_address: 172.30.47.3

networks:
  production:
    name: xianyu-saas-production
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.47.0/24
          gateway: 172.30.47.1
